# Vegapunk stable release builds for macOS Apple Silicon (.dmg and updater archive).
#
# CI calls the same packaging/build_dmg.sh script developers run locally.
# This file only provisions the toolchain (Node, Rust, a Python venv at .venv with PyInstaller)
# and publishes the results.
#
# Triggers:
#   - tag push `v*`  → builds the Apple Silicon target and attaches it to a DRAFT GitHub Release
#                      (review, then publish by hand).
#   - manual run     → builds and uploads workflow artifacts only (no release).
#
# Each artifact is uploaded with a stable Vegapunk name so the manifest can point at the
# tag-pinned GitHub asset without relying on a moving URL.
#
# macOS signing + notarization: Tauri's bundler handles both during `tauri build` when the
# APPLE_* env vars are present (import cert → sign app + sidecar with hardened runtime →
# notarize via notarytool → staple). Driven by repo secrets:
#   APPLE_CERTIFICATE            base64 .p12 (Developer ID Application cert + key)
#   APPLE_CERTIFICATE_PASSWORD   the .p12 export password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_CONTENT        base64 App Store Connect API .p8 (notarytool)
#   APPLE_API_KEY                the API key id
#   APPLE_API_ISSUER             the API issuer id
# When the secrets are absent (forks, scratch runs) the build degrades to unsigned and is
# not eligible for the Stable Release Channel.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            slug: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: surfaces/gui/src-tauri

      - name: Verify Apple Silicon runner
        run: |
          HOST_TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$HOST_TRIPLE" != "aarch64-apple-darwin" ]; then
            echo "::error::stable releases require an Apple Silicon runner, got $HOST_TRIPLE"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the sidecar venv (.venv)
        # The build scripts expect a venv at .venv with the package + PyInstaller.
        # typer/tzdata are build-time-only (PyInstaller walks mcp.cli, which needs typer;
        # tzdata ships zoneinfo for Windows). aisuite installs like any other dependency
        # (git-pinned in pyproject.toml).
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.venv/Scripts/python; else VPY=.venv/bin/python; fi
          "$VPY" -m pip install --upgrade pip
          "$VPY" -m pip install -e ".[bedrock]" pyinstaller typer tzdata
          "$VPY" -c "import aisuite, coworker"  # fail fast if either import breaks

      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci

      - name: Require stable release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          require_secret() {
            if [ -z "$2" ]; then
              echo "::error::missing required stable release secret $1"
              exit 1
            fi
          }
          require_secret APPLE_CERTIFICATE "${APPLE_CERTIFICATE:-}"
          require_secret APPLE_SIGNING_IDENTITY "${APPLE_SIGNING_IDENTITY:-}"
          require_secret APPLE_API_KEY_CONTENT "${APPLE_API_KEY_CONTENT:-}"
          require_secret APPLE_API_KEY "${APPLE_API_KEY:-}"
          require_secret APPLE_API_ISSUER "${APPLE_API_ISSUER:-}"
          require_secret TAURI_SIGNING_PRIVATE_KEY "${TAURI_SIGNING_PRIVATE_KEY:-}"

      - name: Build .dmg (macOS Apple Silicon)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Auto-update artifact signing (minisign, separate from Apple signing). Absent ->
          # the build script skips updater artifacts with a warning (fork/scratch runs).
          # The private key is a protected repository secret; the stable-release environment
          # gates publication after the signed manifest is composed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Unset empty APPLE_* vars so runs without secrets stay cleanly unsigned
          # (Tauri treats a present-but-empty var as a config error).
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            [ -n "$(eval echo "\${$v:-}")" ] || unset "$v"
          done
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            echo "$APPLE_API_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          unset APPLE_API_KEY_CONTENT
          bash packaging/build_dmg.sh

      - name: Stage artifacts (Vegapunk names)
        run: |
          mkdir -p out
          BUNDLE=surfaces/gui/src-tauri/target/release/bundle
          cp "$BUNDLE"/dmg/*.dmg out/Vegapunk-${{ matrix.slug }}.dmg
          # The updater artifact is the signed .app archive the installed app swaps in.
          if [ -f "$BUNDLE"/macos/OpenWorker.app.tar.gz ]; then
            cp "$BUNDLE"/macos/OpenWorker.app.tar.gz out/Vegapunk-${{ matrix.slug }}.app.tar.gz
            cp "$BUNDLE"/macos/OpenWorker.app.tar.gz.sig out/Vegapunk-${{ matrix.slug }}.app.tar.gz.sig
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose the auto-update manifest (latest.json)
        # Shipped apps poll releases/latest/download/latest.json from Vegapunk. Publishing
        # this release pushes the update. The tag must match tauri.conf.json's version or installed apps would
        # see a permanent phantom update; fail loudly on drift. Stable tags also fail
        # before publication when any signed updater artifact is missing.
        run: |
          TAG="${GITHUB_REF_NAME}"
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('surfaces/gui/src-tauri/tauri.conf.json'))['version'])")
          if [[ "${TAG#v}" == *-* ]]; then
            echo "::error::stable releases cannot use a pre-release tag: $TAG"
            exit 1
          fi
          if [ "${TAG#v}" != "$CONF_VERSION" ]; then
            echo "::error::tag $TAG != tauri.conf.json version $CONF_VERSION - bump the config before tagging"
            exit 1
          fi
          if [ ! -f dist/Vegapunk-macos-arm64.app.tar.gz ] || [ ! -f dist/Vegapunk-macos-arm64.app.tar.gz.sig ]; then
            echo "::error::missing signed Vegapunk macOS updater artifact - stable releases require the archive and signature"
            exit 1
          fi
          python3 packaging/make_update_manifest.py \
            --version "${TAG#v}" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dist dist --out dist/latest.json \
            --notes "Vegapunk ${TAG#v}"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
