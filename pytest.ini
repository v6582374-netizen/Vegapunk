[pytest]
testpaths = tests

# This machine sources ROS 2 Humble, which puts /opt/ros/humble on PYTHONPATH
# and auto-registers ROS's pytest plugins. Two of them break collection here
# and neither is used by this repository:
#
#   launch_testing  imports ``launch.actions``, which resolves to this repo's
#                   own top-level ``launch.py`` instead of ROS's ``launch``
#                   package, and collection dies on the shadowed import.
#   launch_ros      registers ``pytest_launch_collect_makemodule``, a hook that
#                   only exists inside launch_testing, so disabling that one
#                   alone turns the failure into a plugin validation error.
#
# They are disabled together, in the config rather than per invocation, so the
# suite runs the same way for every developer and in CI.
addopts = -p no:launch_testing -p no:launch_ros
