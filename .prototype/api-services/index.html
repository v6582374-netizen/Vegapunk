<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Settings · API Services prototype</title>
    <style>
      :root {
        color-scheme: light;
        font: 100%/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --canvas: #f5f5f7;
        --surface: rgba(255, 255, 255, 0.79);
        --surface-solid: #ffffff;
        --surface-muted: rgba(246, 247, 249, 0.86);
        --ink: #1d1d1f;
        --ink-soft: #5f636d;
        --ink-faint: #8a8e98;
        --line: rgba(17, 24, 39, 0.09);
        --line-strong: rgba(17, 24, 39, 0.15);
        --accent: #2164e8;
        --accent-soft: #e9f0ff;
        --success: #168342;
        --success-soft: #e7f6eb;
        --warning: #a45b00;
        --warning-soft: #fff2dc;
        --danger: #bd3e3e;
        --danger-soft: #ffebeb;
        --shadow-1: 0 1px 2px rgba(19, 27, 45, 0.04), 0 12px 28px rgba(19, 27, 45, 0.06);
        --shadow-2: 0 2px 3px rgba(19, 27, 45, 0.06), 0 20px 48px rgba(19, 27, 45, 0.1);
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * { box-sizing: border-box; }
      html { min-width: 320px; background: var(--canvas); }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 78% -10%, rgba(204, 224, 255, 0.48), transparent 32rem),
          radial-gradient(circle at -8% 36%, rgba(236, 224, 255, 0.32), transparent 28rem),
          var(--canvas);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      button:focus-visible, input:focus-visible {
        outline: 3px solid rgba(33, 100, 232, 0.28);
        outline-offset: 2px;
      }
      #stage { min-height: 100vh; padding-bottom: 92px; }

      .variant-root {
        min-height: 100vh;
        animation: variant-in 260ms var(--ease) both;
      }
      @keyframes variant-in {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .app-shell {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        min-height: 100vh;
        max-width: 1440px;
        margin: 0 auto;
      }
      .sidebar {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        padding: 26px 16px 20px;
        background: rgba(249, 249, 251, 0.62);
        border-right: 1px solid rgba(17, 24, 39, 0.06);
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        backdrop-filter: blur(24px) saturate(150%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px 28px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 9px;
        color: #fff;
        font-size: 12px;
        font-weight: 750;
        background: linear-gradient(145deg, #2d71ff, #7639d9);
        box-shadow: 0 4px 10px rgba(61, 86, 197, 0.24);
      }
      .nav-label {
        padding: 0 11px 8px;
        color: var(--ink-faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .side-nav { display: grid; gap: 4px; }
      .side-nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 0 11px;
        border-radius: 11px;
        color: var(--ink-soft);
        font-size: 13px;
        text-decoration: none;
        transition: color 150ms ease-out, background-color 150ms ease-out;
      }
      .side-nav a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.62); }
      .side-nav a[aria-current="page"] {
        color: var(--ink);
        font-weight: 650;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 2px rgba(20, 29, 46, 0.06);
      }
      .nav-glyph {
        display: grid;
        place-items: center;
        width: 18px;
        color: currentColor;
        font-size: 14px;
      }
      .side-foot {
        position: absolute;
        right: 16px;
        bottom: 20px;
        left: 16px;
        padding: 13px 12px;
        border: 1px solid rgba(17, 24, 39, 0.06);
        border-radius: 15px;
        color: var(--ink-soft);
        font-size: 11px;
        line-height: 1.45;
        background: rgba(255, 255, 255, 0.52);
      }
      .side-foot strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 11px; }

      .main-content {
        width: min(100%, 1060px);
        padding: 46px clamp(24px, 5vw, 72px) 110px;
      }
      .page-header { max-width: 760px; }
      .breadcrumbs {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 18px;
        color: var(--ink-faint);
        font-size: 12px;
      }
      .breadcrumbs strong { color: var(--ink-soft); font-weight: 600; }
      .page-kicker {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 10px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .page-kicker::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        content: "";
        background: currentColor;
        box-shadow: 0 0 0 4px rgba(33, 100, 232, 0.11);
      }
      h1, h2, h3, p { margin: 0; }
      h1 {
        margin-bottom: 12px;
        font-size: clamp(30px, 4vw, 42px);
        line-height: 1.05;
        letter-spacing: -0.035em;
        font-weight: 760;
        font-optical-sizing: auto;
      }
      .lede {
        max-width: 680px;
        color: var(--ink-soft);
        font-size: 15px;
        line-height: 1.58;
      }
      .context-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
      }
      .context-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.58);
      }
      .context-chip svg { width: 13px; height: 13px; }
      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin: 42px 0 14px;
      }
      .section-heading h2 { font-size: 16px; letter-spacing: -0.01em; }
      .section-heading p { color: var(--ink-faint); font-size: 12px; }

      .service-card, .inspector-panel, .signal-card {
        border: 1px solid var(--line);
        background: var(--surface);
        -webkit-backdrop-filter: blur(18px) saturate(135%);
        backdrop-filter: blur(18px) saturate(135%);
        box-shadow: var(--shadow-1);
      }
      .service-card {
        border-radius: 20px;
        overflow: hidden;
      }
      .service-card + .service-card { margin-top: 12px; }
      .service-card-inner { padding: 20px 22px 18px; }
      .service-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }
      .service-identity { display: flex; align-items: center; gap: 13px; min-width: 0; }
      .service-mark {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 13px;
        color: #fff;
        font-size: 13px;
        font-weight: 760;
        letter-spacing: -0.04em;
        background: var(--service-accent);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.32), 0 5px 12px color-mix(in srgb, var(--service-accent) 24%, transparent);
      }
      .service-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
      .service-type { margin-top: 2px; color: var(--ink-faint); font-size: 12px; }
      .service-card-controls { display: flex; align-items: center; gap: 12px; }
      .switch-wrap { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-faint); font-size: 11px; font-weight: 600; }
      .switch {
        position: relative;
        width: 42px;
        height: 25px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #d5d7dc;
        cursor: pointer;
        transition: background-color 180ms ease-out, transform 100ms ease-out;
      }
      .switch::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 19px;
        height: 19px;
        border-radius: 50%;
        content: "";
        background: #fff;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.26);
        transition: transform 180ms var(--ease);
      }
      .switch[aria-checked="true"] { background: #2d9b5f; }
      .switch[aria-checked="true"]::after { transform: translateX(17px); }
      .switch:active { transform: scale(0.94); }
      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
        background: rgba(238, 240, 244, 0.9);
      }
      .status-chip.status-connected { color: var(--success); background: var(--success-soft); }
      .status-chip.status-pending, .status-chip.status-testing { color: var(--warning); background: var(--warning-soft); }
      .status-chip.status-error { color: var(--danger); background: var(--danger-soft); }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .status-testing .status-dot { animation: dot-pulse 900ms ease-in-out infinite; }
      @keyframes dot-pulse { 0%, 100% { opacity: 0.38; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
      .service-fields {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
        gap: 12px;
        margin-top: 21px;
      }
      .field { min-width: 0; }
      .field-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 7px;
        color: var(--ink-faint);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .read-only-label { color: var(--ink-faint); font-weight: 500; }
      .input-shell { position: relative; }
      .text-input {
        width: 100%;
        height: 39px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        color: var(--ink);
        font-size: 12px;
        background: rgba(248, 249, 251, 0.92);
        transition: border-color 150ms ease-out, background-color 150ms ease-out, box-shadow 150ms ease-out;
      }
      .text-input:hover { border-color: var(--line-strong); }
      .text-input:focus { border-color: rgba(33, 100, 232, 0.5); background: #fff; box-shadow: 0 0 0 4px rgba(33, 100, 232, 0.09); outline: none; }
      .text-input[readonly] { color: var(--ink-soft); cursor: default; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
      .secret-input { padding-right: 70px; }
      .visibility-btn {
        position: absolute;
        top: 50%;
        right: 7px;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 27px;
        padding: 0 7px;
        border: 0;
        border-radius: 7px;
        color: var(--ink-faint);
        font-size: 10px;
        cursor: pointer;
        transform: translateY(-50%);
        background: transparent;
        transition: color 150ms ease-out, background-color 150ms ease-out;
      }
      .visibility-btn:hover { color: var(--ink); background: rgba(17, 24, 39, 0.06); }
      .visibility-btn svg { width: 13px; height: 13px; }
      .endpoint-note { margin-top: 6px; color: var(--ink-faint); font-size: 10px; }
      .service-card-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid rgba(17, 24, 39, 0.06);
      }
      .status-meta { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--ink-faint); font-size: 11px; }
      .status-meta .status-message { color: var(--ink-soft); }
      .status-meta .status-message[data-tone="error"] { color: var(--danger); }
      .status-meta .status-message[data-tone="success"] { color: var(--success); }
      .actions { display: flex; align-items: center; gap: 8px; }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 0 13px;
        border: 1px solid transparent;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: -0.005em;
        cursor: pointer;
        transition: transform 100ms ease-out, background-color 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
      }
      .button:active { transform: scale(0.97); }
      .button-secondary { color: var(--ink-soft); border-color: var(--line); background: rgba(255, 255, 255, 0.58); }
      .button-secondary:hover { color: var(--ink); border-color: var(--line-strong); background: #fff; }
      .button-primary { color: #fff; border-color: #2164e8; background: var(--accent); box-shadow: 0 4px 10px rgba(33, 100, 232, 0.18); }
      .button-primary:hover { background: #1957cc; }
      .button-primary[data-saved="true"] { color: var(--success); border-color: rgba(22, 131, 66, 0.2); background: var(--success-soft); box-shadow: none; }
      .button[disabled] { opacity: 0.48; cursor: wait; }
      .disabled-card { opacity: 0.8; }
      .disabled-card .service-card-inner { background: linear-gradient(105deg, rgba(250, 250, 251, 0.8), rgba(245, 246, 248, 0.7)); }

      /* Quiet Stack */
      .quiet-list { margin-top: 2px; }
      .quiet-card { animation: card-in 300ms var(--ease) both; animation-delay: calc(var(--card-index) * 45ms); }
      @keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .quiet-summary {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 2px;
        color: var(--ink-faint);
        font-size: 11px;
      }
      .quiet-summary strong { color: var(--ink-soft); font-weight: 650; }
      .quiet-summary .summary-spacer { flex: 1; }

      /* Focused Inspector */
      .inspector-layout {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 16px;
        margin-top: 34px;
      }
      .service-index {
        align-self: start;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.53);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
      }
      .index-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 7px 11px;
        color: var(--ink-faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .index-count {
        min-width: 20px;
        padding: 2px 5px;
        border-radius: 999px;
        color: var(--ink-soft);
        font-size: 10px;
        letter-spacing: 0;
        text-align: center;
        background: rgba(17, 24, 39, 0.06);
      }
      .index-item {
        display: grid;
        grid-template-columns: 31px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 58px;
        padding: 7px;
        border: 0;
        border-radius: 13px;
        color: var(--ink-soft);
        text-align: left;
        cursor: pointer;
        background: transparent;
        transition: background-color 150ms ease-out, color 150ms ease-out, transform 100ms ease-out;
      }
      .index-item:hover { color: var(--ink); background: rgba(255, 255, 255, 0.72); }
      .index-item:active { transform: scale(0.985); }
      .index-item[aria-current="true"] { color: var(--ink); background: rgba(255, 255, 255, 0.95); box-shadow: 0 1px 3px rgba(18, 26, 44, 0.07); }
      .index-mark { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; color: #fff; font-size: 10px; font-weight: 750; background: var(--service-accent); }
      .index-name { overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .index-sub { margin-top: 1px; color: var(--ink-faint); font-size: 10px; }
      .index-state { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
      .index-state.connected { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
      .index-state.pending, .index-state.testing { background: #c17a11; box-shadow: 0 0 0 3px var(--warning-soft); }
      .index-state.error { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
      .inspector-panel {
        min-width: 0;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: var(--shadow-2);
      }
      .inspector-hero {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding: 25px 28px 24px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(239, 244, 255, 0.64));
        border-bottom: 1px solid rgba(17, 24, 39, 0.07);
      }
      .inspector-hero .service-mark { width: 52px; height: 52px; border-radius: 16px; font-size: 15px; }
      .inspector-title { display: flex; align-items: center; gap: 14px; }
      .inspector-title h2 { font-size: 21px; letter-spacing: -0.025em; }
      .inspector-title p { margin-top: 3px; color: var(--ink-soft); font-size: 12px; }
      .inspector-hero .status-chip { margin-top: 3px; }
      .inspector-body { padding: 24px 28px 26px; }
      .inspector-body .service-fields { grid-template-columns: 1fr; margin-top: 0; }
      .inspector-body .text-input { height: 43px; }
      .inspector-body .service-card-bottom { margin-top: 25px; padding-top: 19px; }
      .inspector-note {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-top: 20px;
        padding: 12px 13px;
        border-radius: 12px;
        color: var(--ink-soft);
        font-size: 11px;
        line-height: 1.5;
        background: rgba(239, 243, 250, 0.72);
      }
      .inspector-note svg { flex: 0 0 auto; width: 15px; height: 15px; color: var(--accent); }
      .inspector-checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 24px; }
      .check-tile { padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(249, 250, 252, 0.78); }
      .check-tile-label { color: var(--ink-faint); font-size: 10px; }
      .check-tile-value { margin-top: 3px; color: var(--ink); font-size: 12px; font-weight: 650; }

      /* Signal Grid */
      .signal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 34px; }
      .signal-card {
        position: relative;
        min-width: 0;
        padding: 20px;
        border-radius: 21px;
        overflow: hidden;
      }
      .signal-card::before { position: absolute; inset: 0 0 auto; height: 2px; content: ""; background: rgba(17, 24, 39, 0.12); }
      .signal-card { animation: card-in 300ms var(--ease) both; animation-delay: calc(var(--card-index) * 45ms); }
      .signal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
      .signal-identity { min-width: 0; padding-top: 1px; }
      .signal-name { font-size: 16px; font-weight: 720; letter-spacing: -0.02em; }
      .signal-type { margin-top: 2px; color: var(--ink-faint); font-size: 11px; }
      .signal-card .status-chip { margin-top: 1px; }
      .signal-card .service-fields { grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
      .signal-card .text-input { height: 38px; }
      .signal-card .service-card-bottom { display: block; margin-top: 17px; padding-top: 14px; }
      .signal-card .status-meta { margin-bottom: 12px; }
      .signal-card .actions { justify-content: flex-end; }
      .signal-card.disabled-card { background: rgba(245, 246, 248, 0.76); }
      .grid-footnote { margin-top: 16px; color: var(--ink-faint); font-size: 11px; }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 26px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 9px;
        max-width: min(360px, calc(100vw - 48px));
        padding: 11px 14px;
        border: 1px solid rgba(17, 24, 39, 0.1);
        border-radius: 13px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: var(--shadow-2);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        animation: toast-in 220ms var(--ease) both;
      }
      .toast.success { color: var(--success); }
      .toast.error { color: var(--danger); }
      .toast-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      @keyframes toast-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

      /* Prototype picker — intentionally kept as supplied by the prototype skill. */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }
      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }
      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
      }
      .proto-picker-item {
        position: relative;
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition: color 150ms ease-out;
      }
      .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
      .proto-picker-item:active { transform: scale(0.97); }
      .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
      .proto-picker-item[data-active] { color: #fff; }
      .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
      .proto-picker-replay { padding: 0 10px; font-size: 14px; }
      .proto-picker[data-position="top"] { bottom: auto; top: 24px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
      }
      @media (prefers-reduced-transparency: reduce) {
        .sidebar, .service-card, .inspector-panel, .signal-card, .service-index, .toast { background: var(--surface-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
      }
      @media (prefers-contrast: more) {
        .sidebar, .service-card, .inspector-panel, .signal-card, .service-index, .text-input { border-color: var(--line-strong); }
        .button-secondary { border-color: var(--line-strong); }
      }
      @media (max-width: 900px) {
        .app-shell { grid-template-columns: 76px minmax(0, 1fr); }
        .sidebar { padding-inline: 10px; }
        .brand { justify-content: center; padding-inline: 0; }
        .brand span:last-child, .nav-label, .side-nav a span:not(.nav-glyph), .side-foot { display: none; }
        .side-nav a { justify-content: center; padding-inline: 0; }
        .main-content { padding-inline: clamp(18px, 4vw, 42px); }
      }
      @media (max-width: 700px) {
        .app-shell { display: block; }
        .sidebar { position: relative; display: flex; align-items: center; height: auto; padding: 13px 16px; border-right: 0; border-bottom: 1px solid rgba(17, 24, 39, 0.06); }
        .brand { justify-content: flex-start; padding: 0; }
        .brand span:last-child { display: inline; }
        .side-nav { display: flex; margin-left: auto; }
        .side-nav a { width: 38px; min-height: 34px; }
        .side-nav a span:not(.nav-glyph) { display: none; }
        .main-content { padding-top: 29px; padding-bottom: 92px; }
        .breadcrumbs { margin-bottom: 14px; }
        h1 { font-size: 32px; }
        .service-fields, .inspector-layout { grid-template-columns: 1fr; }
        .inspector-layout { gap: 12px; }
        .service-index { display: flex; gap: 6px; overflow-x: auto; padding: 8px; }
        .index-heading { display: none; }
        .index-item { flex: 0 0 148px; grid-template-columns: 31px minmax(0, 1fr); }
        .index-state { display: none; }
        .inspector-hero, .inspector-body { padding-inline: 20px; }
        .inspector-checks { grid-template-columns: 1fr; }
        .signal-grid { grid-template-columns: 1fr; }
        .service-card-top { align-items: flex-start; }
        .service-card-controls { flex-direction: column-reverse; align-items: flex-end; gap: 8px; }
        .service-card-bottom { align-items: flex-start; flex-direction: column; }
        .actions { width: 100%; justify-content: flex-end; }
        .toast { right: 16px; bottom: 76px; }
        .proto-picker { bottom: 16px; max-width: calc(100vw - 24px); overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-live="polite"></div>

    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">Quiet Stack</button>
      <button class="proto-picker-item">Focused Inspector</button>
      <button class="proto-picker-item">Signal Grid</button>
      <span class="proto-picker-divider" aria-hidden="true"></span>
      <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
    </nav>

    <script>
      const serviceSeed = [
        {
          id: 'arxiv',
          name: 'arXiv',
          type: 'Preprint discovery',
          mode: 'email',
          credentialLabel: 'Contact email',
          credential: 'research@vegapunk.dev',
          placeholder: 'you@lab.org',
          endpoint: 'https://export.arxiv.org/api/query',
          accent: '#e86d4d',
          mark: '∑',
          enabled: true,
          status: 'connected',
          lastChecked: '2 min ago'
        },
        {
          id: 'semantic-scholar',
          name: 'Semantic Scholar',
          type: 'Citation graph',
          mode: 'key',
          credentialLabel: 'API key',
          credential: 'sk-s2-7a31d1b5b3',
          placeholder: 'Paste your API key',
          endpoint: 'https://api.semanticscholar.org/graph/v1',
          accent: '#4e75d7',
          mark: 'S',
          enabled: true,
          status: 'connected',
          lastChecked: '18 min ago'
        },
        {
          id: 'crossref',
          name: 'Crossref',
          type: 'Metadata registry',
          mode: 'email',
          credentialLabel: 'Contact email',
          credential: 'research@vegapunk.dev',
          placeholder: 'you@lab.org',
          endpoint: 'https://api.crossref.org/works',
          accent: '#b17b27',
          mark: 'C',
          enabled: true,
          status: 'connected',
          lastChecked: '1 hr ago'
        },
        {
          id: 'core',
          name: 'CORE',
          type: 'Open access index',
          mode: 'key',
          credentialLabel: 'API key',
          credential: '',
          placeholder: 'Paste your API key',
          endpoint: 'https://api.core.ac.uk/v3/search/works',
          accent: '#6a62b9',
          mark: 'co',
          enabled: false,
          status: 'not-configured',
          lastChecked: 'Never checked'
        }
      ];

      const state = {
        services: Object.fromEntries(serviceSeed.map((service) => [service.id, {
          ...service,
          dirty: false,
          showSecret: false,
          testState: 'idle'
        }])),
        selected: 'arxiv',
        toast: null,
        toastId: 0
      };

      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function getService(id) { return state.services[id]; }
      function allServices() { return Object.values(state.services); }

      function statusInfo(service) {
        if (!service.enabled) return { tone: 'neutral', label: 'Disabled', message: 'Service is off' };
        if (service.testState === 'testing' || service.status === 'testing') return { tone: 'testing', label: 'Testing…', message: 'Checking the service' };
        if (!service.credential.trim()) return { tone: 'error', label: 'Not configured', message: 'Add a credential to connect' };
        if (service.status === 'connected') return { tone: 'connected', label: 'Connected', message: `Checked ${service.lastChecked}` };
        if (service.status === 'error') return { tone: 'error', label: 'Could not connect', message: 'Check the credential and try again' };
        if (service.status === 'pending') return { tone: 'pending', label: 'Changes pending', message: 'Test or save this connection' };
        return { tone: 'pending', label: 'Not tested', message: 'Test this connection when ready' };
      }

      function statusMarkup(service, compact = false) {
        const info = statusInfo(service);
        return `<span class="status-chip status-${info.tone}" data-status data-service-status="${service.id}"><span class="status-dot" data-status-dot></span><span data-status-label>${info.label}</span></span>`;
      }

      function serviceMark(service, small = false) {
        return `<span class="${small ? 'index-mark' : 'service-mark'}" style="--service-accent:${service.accent}" aria-hidden="true">${escapeHtml(service.mark)}</span>`;
      }

      function eyeIcon(open) {
        return open
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.4 12s3.3-5.2 9.6-5.2 9.6 5.2 9.6 5.2-3.3 5.2-9.6 5.2S2.4 12 2.4 12Z"/><circle cx="12" cy="12" r="2.5"/></svg><span>Hide</span>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.95A10.3 10.3 0 0 1 12 6.8c6.3 0 9.6 5.2 9.6 5.2a17.4 17.4 0 0 1-3.1 3.35M6.1 8.1C3.8 9.48 2.4 12 2.4 12s3.3 5.2 9.6 5.2c1.3 0 2.45-.22 3.45-.58"/><path d="M9.8 9.8a3.1 3.1 0 0 0 4.4 4.4"/></svg><span>Show</span>';
      }

      function credentialField(service, idSuffix = '') {
        const isSecret = service.mode === 'key';
        const type = isSecret ? (service.showSecret ? 'text' : 'password') : 'email';
        const suffix = idSuffix ? `-${idSuffix}` : '';
        return `<div class="field">
          <label class="field-label" for="credential-${service.id}${suffix}">${escapeHtml(service.credentialLabel)}${service.dirty ? '<span class="read-only-label">Unsaved</span>' : ''}</label>
          <div class="input-shell">
            <input id="credential-${service.id}${suffix}" class="text-input${isSecret ? ' secret-input' : ''}" type="${type}" value="${escapeHtml(service.credential)}" placeholder="${escapeHtml(service.placeholder)}" autocomplete="off" data-field="credential" data-service="${service.id}" />
            ${isSecret ? `<button class="visibility-btn" type="button" data-action="toggle-visibility" data-service="${service.id}" aria-label="${service.showSecret ? 'Hide API key' : 'Show API key'}">${eyeIcon(service.showSecret)}</button>` : ''}
          </div>
        </div>`;
      }

      function endpointField(service, idSuffix = '') {
        const suffix = idSuffix ? `-${idSuffix}` : '';
        return `<div class="field">
          <div class="field-label"><span>Service address</span><span class="read-only-label">Fixed · read-only</span></div>
          <input id="endpoint-${service.id}${suffix}" class="text-input" type="text" value="${escapeHtml(service.endpoint)}" readonly aria-readonly="true" />
          <p class="endpoint-note">Managed by the connector</p>
        </div>`;
      }

      function serviceActions(service) {
        const info = statusInfo(service);
        const canTest = service.enabled && service.testState !== 'testing';
        return `<div class="service-card-bottom">
          <div class="status-meta" data-meta-service="${service.id}">
            ${statusMarkup(service)}
            <span class="status-message" data-status-message data-tone="${info.tone === 'connected' ? 'success' : info.tone === 'error' ? 'error' : 'neutral'}">${info.message}</span>
          </div>
          <div class="actions">
            <button class="button button-secondary" type="button" data-action="test" data-service="${service.id}" ${canTest ? '' : 'disabled'}>${service.testState === 'testing' ? 'Testing…' : 'Test connection'}</button>
            <button class="button button-primary" type="button" data-action="save" data-service="${service.id}" data-saved="${service.dirty ? 'false' : 'true'}" data-save-button>${service.dirty ? 'Save changes' : 'Saved'}</button>
          </div>
        </div>`;
      }

      function quietCard(service, index) {
        const disabled = !service.enabled;
        return `<article class="service-card quiet-card${disabled ? ' disabled-card' : ''}" data-service-root="${service.id}" style="--card-index:${index}; --service-accent:${service.accent}">
          <div class="service-card-inner">
            <div class="service-card-top">
              <div class="service-identity">${serviceMark(service)}<div><div class="service-name">${escapeHtml(service.name)}</div><div class="service-type">${escapeHtml(service.type)}</div></div></div>
              <div class="service-card-controls">
                ${statusMarkup(service)}
                <div class="switch-wrap"><span>${service.enabled ? 'Enabled' : 'Disabled'}</span><button class="switch" type="button" role="switch" aria-checked="${service.enabled}" aria-label="${service.enabled ? 'Disable' : 'Enable'} ${escapeHtml(service.name)}" data-action="toggle-enabled" data-service="${service.id}"></button></div>
              </div>
            </div>
            <div class="service-fields">${credentialField(service)}${endpointField(service)}</div>
            ${serviceActions(service)}
          </div>
        </article>`;
      }

      function shell(sideContent, mainContent, variantClass) {
        return `<div class="variant-root ${variantClass}"><div class="app-shell">
          <aside class="sidebar">
            <div class="brand"><span class="brand-mark">V</span><span>Vegapunk</span></div>
            <div class="nav-label">Workspace</div>
            <nav class="side-nav" aria-label="Settings navigation">
              <a href="#" onclick="return false"><span class="nav-glyph">⌂</span><span>Overview</span></a>
              <a href="#" onclick="return false"><span class="nav-glyph">◒</span><span>Search</span></a>
              <a href="#" onclick="return false"><span class="nav-glyph">▱</span><span>Launch</span></a>
              <a href="#" aria-current="page" onclick="return false"><span class="nav-glyph">⚙</span><span>Settings</span></a>
            </nav>
            <div class="side-foot"><strong>Linux-first setup</strong>Credentials stay on this machine and are never part of project configuration.</div>
          </aside>
          <main class="main-content">${mainContent}</main>
        </div>${state.toast ? `<div class="toast ${state.toast.tone}" role="status"><span class="toast-dot"></span><span>${escapeHtml(state.toast.message)}</span></div>` : ''}</div>`;
      }

      function pageHeader(intro = 'Connect the scholarly services that power discovery. Each service keeps one simple connection profile.') {
        return `<header class="page-header"><div class="breadcrumbs"><span>Settings</span><span aria-hidden="true">›</span><strong>API Services</strong></div><div class="page-kicker">Connections</div><h1>API Services</h1><p class="lede">${intro}</p><div class="context-row"><span class="context-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v17M3.5 12h17"/></svg>4 services</span><span class="context-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/><path d="M12 3.5v5h5"/><path d="M5.7 18.3 4 20"/></svg>Local credentials</span><span class="context-chip">Linux desktop</span></div></header>`;
      }

      function renderQuiet() {
        const services = allServices();
        return shell('', `${pageHeader()}<div class="section-heading"><div><h2>Service connections</h2><p>One profile per service, saved independently.</p></div><div class="quiet-summary"><strong>${services.filter((s) => s.enabled).length} enabled</strong><span aria-hidden="true">·</span><span>${services.filter((s) => statusInfo(s).tone === 'connected').length} connected</span></div></div><section class="quiet-list" aria-label="API service connections">${services.map(quietCard).join('')}</section>`, 'variant-quiet');
      }

      function indexItem(service) {
        const info = statusInfo(service);
        return `<button class="index-item" type="button" aria-current="${state.selected === service.id}" data-action="select-service" data-service="${service.id}" style="--service-accent:${service.accent}">${serviceMark(service, true)}<span><span class="index-name">${escapeHtml(service.name)}</span><span class="index-sub">${escapeHtml(service.type)}</span></span><span class="index-state ${info.tone}" aria-label="${info.label}"></span></button>`;
      }

      function inspectorDetail(service) {
        const info = statusInfo(service);
        const enabled = service.enabled;
        return `<section class="inspector-panel" data-service-root="${service.id}">
          <div class="inspector-hero"><div class="inspector-title">${serviceMark(service)}<div><h2>${escapeHtml(service.name)}</h2><p>${escapeHtml(service.type)} · one connection profile</p></div></div><div>${statusMarkup(service)}<div class="switch-wrap" style="justify-content:flex-end;margin-top:10px"><span>${enabled ? 'Enabled' : 'Disabled'}</span><button class="switch" type="button" role="switch" aria-checked="${enabled}" aria-label="${enabled ? 'Disable' : 'Enable'} ${escapeHtml(service.name)}" data-action="toggle-enabled" data-service="${service.id}"></button></div></div></div>
          <div class="inspector-body"><div class="service-fields">${credentialField(service, 'inspector')}${endpointField(service, 'inspector')}</div>
            <div class="inspector-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v5.2"/><path d="M12 7.4h.01"/></svg><span>The address is fixed by the connector. Only the credential and enabled state can be changed here.</span></div>
            <div class="inspector-checks"><div class="check-tile"><div class="check-tile-label">Connection status</div><div class="check-tile-value" data-status-label>${info.label}</div></div><div class="check-tile"><div class="check-tile-label">Last checked</div><div class="check-tile-value" data-last-checked>${escapeHtml(service.lastChecked)}</div></div><div class="check-tile"><div class="check-tile-label">Credential storage</div><div class="check-tile-value">Local only</div></div></div>
            ${serviceActions(service)}
          </div>
        </section>`;
      }

      function renderInspector() {
        const selected = getService(state.selected) || getService('arxiv');
        return shell('', `${pageHeader('Choose a service to inspect its one connection profile. The panel keeps the common path visible and quiet.') }<div class="inspector-layout"><nav class="service-index" aria-label="API services"><div class="index-heading"><span>Services</span><span class="index-count">${allServices().length}</span></div>${allServices().map(indexItem).join('')}</nav>${inspectorDetail(selected)}</div>`, 'variant-inspector');
      }

      function signalCard(service, index) {
        const disabled = !service.enabled;
        return `<article class="signal-card${disabled ? ' disabled-card' : ''}" data-service-root="${service.id}" style="--card-index:${index}">
          <div class="signal-head"><div class="signal-identity"><div class="signal-name">${escapeHtml(service.name)}</div><div class="signal-type">${escapeHtml(service.type)}</div></div>${statusMarkup(service)}</div>
          <div class="service-fields">${credentialField(service, 'grid')}${endpointField(service, 'grid')}</div>
          ${serviceActions(service)}
        </article>`;
      }

      function renderGrid() {
        return shell('', `${pageHeader('Scan the connection landscape at a glance. The signal on each tile is the current state of that service.') }<section class="signal-grid" aria-label="API service connection grid">${allServices().map(signalCard).join('')}</section><p class="grid-footnote">Color is reserved for connection state; service identity stays neutral. Fixed addresses are shown for transparency; launch-time retrieval settings live elsewhere.</p>`, 'variant-grid');
      }

      const variants = [renderQuiet, renderInspector, renderGrid];

      function moveHighlight() {
        const el = items[current];
        if (!el) return;
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      function showToast(message, tone = 'neutral') {
        state.toastId += 1;
        const id = state.toastId;
        state.toast = { message, tone };
        mount(current);
        window.setTimeout(() => {
          if (state.toastId !== id) return;
          state.toast = null;
          mount(current);
        }, 2500);
      }

      function syncServiceVisuals(id) {
        const service = getService(id);
        if (!service) return;
        const info = statusInfo(service);
        stage.querySelectorAll(`[data-service-root="${id}"]`).forEach((root) => {
          root.classList.toggle('disabled-card', !service.enabled);
          root.querySelectorAll('[data-status]').forEach((el) => {
            el.className = `status-chip status-${info.tone}`;
            const label = el.querySelector('[data-status-label]');
            if (label) label.textContent = info.label;
            const dot = el.querySelector('[data-status-dot]');
            if (dot) dot.className = 'status-dot';
          });
          root.querySelectorAll('[data-status-message]').forEach((el) => {
            el.textContent = info.message;
            el.dataset.tone = info.tone === 'connected' ? 'success' : info.tone === 'error' ? 'error' : 'neutral';
          });
          root.querySelectorAll('[data-save-button]').forEach((button) => {
            button.dataset.saved = service.dirty ? 'false' : 'true';
            button.textContent = service.dirty ? 'Save changes' : 'Saved';
          });
          root.querySelectorAll('[data-action="test"]').forEach((button) => {
            button.disabled = !service.enabled || service.testState === 'testing';
            button.textContent = service.testState === 'testing' ? 'Testing…' : 'Test connection';
          });
          root.querySelectorAll('[data-action="toggle-enabled"]').forEach((button) => {
            button.setAttribute('aria-checked', String(service.enabled));
            button.setAttribute('aria-label', `${service.enabled ? 'Disable' : 'Enable'} ${service.name}`);
          });
          root.querySelectorAll('.switch-wrap > span').forEach((label) => {
            if (label.textContent === 'Enabled' || label.textContent === 'Disabled') label.textContent = service.enabled ? 'Enabled' : 'Disabled';
          });
          root.querySelectorAll('[data-last-checked]').forEach((el) => { el.textContent = service.lastChecked; });
          root.querySelectorAll('.index-state').forEach((el) => {
            el.className = `index-state ${info.tone}`;
            el.setAttribute('aria-label', info.label);
          });
        });
      }

      function toggleEnabled(id) {
        const service = getService(id);
        service.enabled = !service.enabled;
        service.dirty = true;
        if (!service.enabled) {
          service.testState = 'idle';
        } else if (!service.credential.trim()) {
          service.status = 'not-configured';
        } else {
          service.status = 'pending';
        }
        mount(current);
      }

      function toggleVisibility(id) {
        const service = getService(id);
        service.showSecret = !service.showSecret;
        mount(current);
      }

      function testConnection(id) {
        const service = getService(id);
        if (!service.enabled) {
          showToast(`Enable ${service.name} before testing.`, 'error');
          return;
        }
        if (!service.credential.trim()) {
          service.status = 'error';
          service.testState = 'idle';
          showToast(`Add a ${service.credentialLabel.toLowerCase()} before testing.`, 'error');
          return;
        }
        service.testState = 'testing';
        service.status = 'testing';
        mount(current);
        window.setTimeout(() => {
          service.testState = 'idle';
          service.status = 'connected';
          service.lastChecked = 'just now';
          showToast(`${service.name} connection looks good.`, 'success');
        }, 780);
      }

      function saveService(id) {
        const service = getService(id);
        service.dirty = false;
        showToast(`${service.name} settings saved.`, 'success');
      }

      stage.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        const action = target.dataset.action;
        const id = target.dataset.service;
        if (action === 'toggle-enabled') toggleEnabled(id);
        if (action === 'toggle-visibility') toggleVisibility(id);
        if (action === 'test') testConnection(id);
        if (action === 'save') saveService(id);
        if (action === 'select-service') {
          state.selected = id;
          mount(current);
        }
      });

      stage.addEventListener('input', (event) => {
        const input = event.target.closest('[data-field="credential"]');
        if (!input) return;
        const service = getService(input.dataset.service);
        if (!service) return;
        service.credential = input.value;
        service.dirty = true;
        service.status = service.credential.trim() ? 'pending' : 'not-configured';
        service.testState = 'idle';
        syncServiceVisuals(service.id);
      });

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);
      document.addEventListener('keydown', (event) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const num = parseInt(event.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (event.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (event.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (event.key === 'r' || event.key === 'R') mount(current);
      });

      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    </script>
  </body>
</html>
