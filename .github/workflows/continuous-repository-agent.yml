name: Continuous repository agent

on:
  # GitHub Actions jobs are finite-lived. A scheduled run is the reliable cloud
  # equivalent of keeping an auditor alive continuously, without leaving a
  # runner (and its bill) running forever.
  schedule:
    # GitHub cron uses UTC; 16:00 UTC is 00:00 the next day in Asia/Shanghai.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      ignore_pause:
        description: "Run once even when REPOSITORY_AGENT_PAUSED=true"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: continuous-repository-agent
  cancel-in-progress: false

jobs:
  audit:
    if: vars.REPOSITORY_AGENT_PAUSED != 'true' || inputs.ignore_pause == true
    name: Run long-lived audit loop and publish findings
    runs-on: ubuntu-latest
    # Leave a small cleanup margin below GitHub-hosted runner's six-hour cap.
    timeout-minutes: 355
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      # Optional Repository variable; the default is DeepSeek's general chat
      # model and keeps the existing two-variable setup sufficient.
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      AUDIT_REPORT_PATH: audit-report.md
      AUDIT_RUN_MINUTES: "340"
      AUDIT_CYCLE_PAUSE_SECONDS: "30"

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install lightweight audit tools
        run: |
          python -m pip install --disable-pip-version-check \
            pytest ruff bandit vulture pip-audit

      - name: Run cloud repository agent
        run: python .github/agent/repo_auditor.py

      - name: Publish audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit-${{ github.run_number }}
          path: audit-report.md
          if-no-files-found: warn
          retention-days: 30
